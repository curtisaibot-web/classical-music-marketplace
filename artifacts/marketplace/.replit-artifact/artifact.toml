kind = "web"
previewPath = "/"
title = "Classical Music Marketplace"
version = "1.0.0"
id = "artifacts/marketplace"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/marketplace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marketplace", "run", "build" ]

[services.production.run]
# Tiny Node.js server with UA-based OG routing for crawler requests to /musicians/:slug
args = ["node", "artifacts/marketplace/server.mjs"]

[services.production.run.env]
PORT = "5173"
API_PORT = "8080"
NODE_ENV = "production"

[services.env]
PORT = "5173"
BASE_PATH = "/"
