openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Classical Music Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: teachers
    description: Teacher profile operations
  - name: students
    description: Student profile operations
  - name: listings
    description: Listing operations
  - name: masterclasses
    description: Masterclass event operations
  - name: digital-products
    description: Digital product operations
  - name: bookings
    description: Booking operations
  - name: orders
    description: Order operations
  - name: reviews
    description: Review operations
  - name: dashboard
    description: Dashboard summary operations
  - name: stripe
    description: Stripe payment and Connect operations
  - name: storage
    description: Object storage upload and serving endpoints
  - name: reels
    description: Booking reel upload and processing operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Users ──────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/onboard:
    post:
      operationId: onboardUser
      tags: [users]
      summary: Set role and create profile after signup
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardUserBody"
      responses:
        "200":
          description: Onboarded user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Teacher Profiles ───────────────────────────────────────────────────────
  /teachers:
    get:
      operationId: listTeachers
      tags: [teachers]
      summary: Browse teacher profiles
      parameters:
        - name: instrument
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: listingType
          in: query
          schema:
            type: string
            enum: [lesson, event, masterclass, digital_product]
        - name: dayOfWeek
          in: query
          description: "Filter teachers by the day of week they have masterclass events scheduled (0=Sunday, 1=Monday, ..., 6=Saturday). When listingType is 'lesson', 'event', or 'digital_product', this parameter is ignored because those listing types have no rows in masterclass_events — all matching teachers are returned regardless of this value."
          schema:
            type: integer
            minimum: 0
            maximum: 6
        - name: instruments
          in: query
          description: "Comma-separated list of instruments to filter by (matches any). Takes precedence over `instrument` when provided."
          schema:
            type: string
        - name: minRate
          in: query
          schema:
            type: integer
        - name: maxRate
          in: query
          schema:
            type: integer
        - name: onlineOnly
          in: query
          description: "When true, only return teachers who have at least one active online listing."
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of teachers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherListResponse"

  /teachers/{userId}:
    get:
      operationId: getTeacher
      tags: [teachers]
      summary: Get a teacher profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /teachers/by-slug/{slug}:
    get:
      operationId: getTeacherBySlug
      tags: [teachers]
      summary: Get a teacher profile by vanity slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /teachers/me/slug:
    put:
      operationId: updateMyTeacherSlug
      tags: [teachers]
      summary: Set or update the teacher's vanity URL slug
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeacherSlugBody"
      responses:
        "200":
          description: Updated teacher profile with new slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Slug already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /teachers/{teacherId}/recordings:
    get:
      operationId: getTeacherRecordings
      tags: [teachers]
      summary: Get recordings for a teacher
      parameters:
        - name: teacherId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of recordings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherRecordingListResponse"

  /teachers/me/recordings:
    post:
      operationId: createTeacherRecording
      tags: [teachers]
      summary: Add a recording to the teacher's profile (max 5)
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeacherRecordingBody"
      responses:
        "201":
          description: Created recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherRecording"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /teachers/me/recordings/{id}:
    delete:
      operationId: deleteTeacherRecording
      tags: [teachers]
      summary: Remove a recording from the teacher's profile
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /teachers/me:
    get:
      operationId: getMyTeacherProfile
      tags: [teachers]
      summary: Get current teacher profile
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateMyTeacherProfile
      tags: [teachers]
      summary: Update current teacher profile
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeacherProfileBody"
      responses:
        "200":
          description: Updated teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Student Profiles ───────────────────────────────────────────────────────
  /students/me:
    get:
      operationId: getMyStudentProfile
      tags: [students]
      summary: Get current student profile
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateMyStudentProfile
      tags: [students]
      summary: Update current student profile
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentProfileBody"
      responses:
        "200":
          description: Updated student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Listings ───────────────────────────────────────────────────────────────
  /listings:
    get:
      operationId: listListings
      tags: [listings]
      summary: Browse all listings
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [lesson, event, masterclass, digital_product]
        - name: instrument
          in: query
          schema:
            type: string
        - name: skillLevel
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: isOnline
          in: query
          schema:
            type: boolean
        - name: dayOfWeek
          in: query
          description: "Filter masterclass listings by day of week (0=Sunday, 1=Monday, ..., 6=Saturday). Only masterclass listings are filtered by this value because they have rows in the masterclass_events table. Listings of type 'lesson', 'event', and 'digital_product' are always included regardless of this filter — they have no fixed schedule stored in masterclass_events."
          schema:
            type: integer
            minimum: 0
            maximum: 6
        - name: minPrice
          in: query
          schema:
            type: integer
        - name: maxPrice
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingListResponse"

    post:
      operationId: createListing
      tags: [listings]
      summary: Create a new listing
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingBody"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      summary: Get a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateListing
      tags: [listings]
      summary: Update a listing
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListingBody"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteListing
      tags: [listings]
      summary: Delete a listing
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /listings/teacher/{userId}:
    get:
      operationId: getTeacherListings
      tags: [listings]
      summary: Get all listings for a teacher
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Teacher's listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingListResponse"

  # ── Masterclasses ──────────────────────────────────────────────────────────
  /masterclasses:
    get:
      operationId: listMasterclasses
      tags: [masterclasses]
      summary: Browse upcoming masterclass events
      parameters:
        - name: instrument
          in: query
          schema:
            type: string
        - name: dayOfWeek
          in: query
          description: "Filter masterclass events by day of week (0=Sunday, 1=Monday, ..., 6=Saturday). Only returns masterclasses whose next occurrence falls on the specified day."
          schema:
            type: integer
            minimum: 0
            maximum: 6
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of masterclasses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterclassListResponse"

    post:
      operationId: createMasterclass
      tags: [masterclasses]
      summary: Create a masterclass event
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMasterclassBody"
      responses:
        "201":
          description: Created masterclass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Masterclass"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /masterclasses/{id}:
    get:
      operationId: getMasterclass
      tags: [masterclasses]
      summary: Get a masterclass event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Masterclass event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Masterclass"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateMasterclass
      tags: [masterclasses]
      summary: Update a masterclass event
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMasterclassBody"
      responses:
        "200":
          description: Updated masterclass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Masterclass"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Digital Products ───────────────────────────────────────────────────────
  /digital-products:
    get:
      operationId: listDigitalProducts
      tags: [digital-products]
      summary: Browse digital products
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: instrument
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of digital products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalProductListResponse"

    post:
      operationId: createDigitalProduct
      tags: [digital-products]
      summary: Create a digital product listing
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDigitalProductBody"
      responses:
        "201":
          description: Created digital product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /digital-products/{id}:
    get:
      operationId: getDigitalProduct
      tags: [digital-products]
      summary: Get a digital product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Digital product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalProduct"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateDigitalProduct
      tags: [digital-products]
      summary: Update a digital product
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDigitalProductBody"
      responses:
        "200":
          description: Updated digital product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Bookings ───────────────────────────────────────────────────────────────
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings for current user
      security: [{ clerkAuth: [] }]
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking request
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBody"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a booking
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Update booking status
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingBody"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Orders ─────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for current user
      security: [{ clerkAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order (digital product or masterclass ticket)
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{id}/download:
    get:
      operationId: getOrderDownload
      tags: [orders]
      summary: Get a signed download URL for a purchased digital product
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Signed download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadRedirectResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Download link has expired

  # ── Storage ────────────────────────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for file upload
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          $ref: "#/components/responses/BadRequest"
        '500':
          description: Failed to generate upload URL.

  # ── Reviews ────────────────────────────────────────────────────────────────
  /reviews/teacher/{userId}:
    get:
      operationId: getTeacherReviews
      tags: [reviews]
      summary: Get reviews for a teacher
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"

  /reviews:
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a review
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Dashboard ──────────────────────────────────────────────────────────────
  /dashboard/teacher:
    get:
      operationId: getTeacherDashboard
      tags: [dashboard]
      summary: Get teacher dashboard summary
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Teacher dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/student:
    get:
      operationId: getStudentDashboard
      tags: [dashboard]
      summary: Get student dashboard summary
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Student dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Stripe ─────────────────────────────────────────────────────────────────
  /stripe/checkout/booking:
    post:
      operationId: createBookingCheckout
      tags: [stripe]
      summary: Create Stripe Checkout session for a lesson or event booking
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingCheckoutBody"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /stripe/checkout/order:
    post:
      operationId: createOrderCheckout
      tags: [stripe]
      summary: Create Stripe Checkout session for an order (masterclass or digital product)
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderCheckoutBody"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Reels ──────────────────────────────────────────────────────────────────
  /reels/upload:
    post:
      operationId: uploadReel
      tags: [reels]
      summary: Upload a raw video file and trigger n8n processing pipeline
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                genre:
                  type: string
                instruments:
                  type: string
                  description: Comma-separated list of instruments
      responses:
        "201":
          description: Reel created and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoReelOwner"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reels/callback:
    post:
      operationId: reelCallback
      tags: [reels]
      summary: n8n callback to update reel processing status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReelCallbackBody"
      responses:
        "200":
          description: Acknowledgement — always 200 so n8n does not retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReelCallbackAck"

  /reels/mine:
    get:
      operationId: getMyReel
      tags: [reels]
      summary: Get current teacher's reel
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Current reel or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoReelOwnerOrNull"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reels/{userId}:
    get:
      operationId: getUserReel
      tags: [reels]
      summary: Get public reel for a musician
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reel or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoReelPublicOrNull"

  /stripe/connect/onboard:
    post:
      operationId: createConnectOnboarding
      tags: [stripe]
      summary: Start Stripe Connect Express onboarding for a teacher
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectOnboardingBody"
      responses:
        "200":
          description: Onboarding URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingUrlResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /stripe/connect/status:
    get:
      operationId: getConnectStatus
      tags: [stripe]
      summary: Get teacher Stripe Connect account status
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Connect status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /stripe/connect/dashboard:
    get:
      operationId: getConnectDashboard
      tags: [stripe]
      summary: Get Stripe Express Dashboard login link for a teacher
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Dashboard URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    # ── User ────────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
          enum: [teacher, student, null]
        createdAt:
          type: string
          format: date-time
      required: [id, email, createdAt]

    OnboardUserBody:
      type: object
      properties:
        role:
          type: string
          enum: [teacher, student]
        firstName:
          type: string
        lastName:
          type: string
      required: [role]

    # ── Teacher Profile ──────────────────────────────────────────────────────
    TeacherProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        bio:
          type: ["string", "null"]
        instruments:
          type: array
          items:
            type: string
        genres:
          type: array
          items:
            type: string
        city:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        timezone:
          type: ["string", "null"]
        hourlyRate:
          type: ["integer", "null"]
        currency:
          type: string
        yearsExperience:
          type: ["integer", "null"]
        education:
          type: ["string", "null"]
        averageRating:
          type: integer
        reviewCount:
          type: integer
        isVerified:
          type: boolean
        profileImageUrl:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        videoIntroUrl:
          type: ["string", "null"]
        profileSlug:
          type: ["string", "null"]
        stripeOnboarded:
          type: boolean
        isProSubscriber:
          type: boolean
        cancellationPolicyHours:
          type: integer
        cancellationFeePercent:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time
      required: [id, userId, instruments, genres, currency, averageRating, reviewCount, isVerified, stripeOnboarded, createdAt]

    TeacherListResponse:
      type: object
      properties:
        teachers:
          type: array
          items:
            $ref: "#/components/schemas/TeacherProfile"
        total:
          type: integer
      required: [teachers, total]

    UpdateTeacherSlugBody:
      type: object
      properties:
        slug:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[a-z0-9-]+$"
      required: [slug]

    TeacherRecording:
      type: object
      properties:
        id:
          type: integer
        teacherId:
          type: string
        url:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, teacherId, url, title, sortOrder, createdAt]

    TeacherRecordingListResponse:
      type: object
      properties:
        recordings:
          type: array
          items:
            $ref: "#/components/schemas/TeacherRecording"
      required: [recordings]

    CreateTeacherRecordingBody:
      type: object
      properties:
        url:
          type: string
        title:
          type: string
        description:
          type: string
        sortOrder:
          type: integer
      required: [url, title]

    UpdateTeacherProfileBody:
      type: object
      properties:
        bio:
          type: string
        instruments:
          type: array
          items:
            type: string
        genres:
          type: array
          items:
            type: string
        city:
          type: string
        country:
          type: string
        timezone:
          type: string
        hourlyRate:
          type: integer
        yearsExperience:
          type: integer
        education:
          type: string
        profileImageUrl:
          type: string
        websiteUrl:
          type: string
        videoIntroUrl:
          type: string

    # ── Student Profile ──────────────────────────────────────────────────────
    StudentProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        bio:
          type: ["string", "null"]
        instruments:
          type: array
          items:
            type: string
        skillLevel:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        timezone:
          type: ["string", "null"]
        learningGoals:
          type: ["string", "null"]
        ageGroup:
          type: ["string", "null"]
        lessonsCompleted:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, userId, instruments, lessonsCompleted, createdAt]

    UpdateStudentProfileBody:
      type: object
      properties:
        bio:
          type: string
        instruments:
          type: array
          items:
            type: string
        skillLevel:
          type: string
        city:
          type: string
        country:
          type: string
        timezone:
          type: string
        learningGoals:
          type: string
        ageGroup:
          type: string

    # ── Listing ──────────────────────────────────────────────────────────────
    Listing:
      type: object
      properties:
        id:
          type: integer
        teacherId:
          type: string
        type:
          type: string
          enum: [lesson, event, masterclass, digital_product]
        status:
          type: string
          enum: [active, inactive, draft]
        title:
          type: string
        description:
          type: ["string", "null"]
        instrument:
          type: ["string", "null"]
        skillLevel:
          type: string
          enum: [beginner, intermediate, advanced, all]
        priceInCents:
          type: integer
        currency:
          type: string
        durationMinutes:
          type: ["integer", "null"]
        imageUrl:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        isOnline:
          type: boolean
        city:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        digitalProductId:
          type: ["integer", "null"]
          description: "ID of the associated digital product (only set when type=digital_product)"
        masterclassEventId:
          type: ["integer", "null"]
          description: "ID of the first upcoming masterclass event (only set when type=masterclass)"
        teacher:
          $ref: "#/components/schemas/TeacherProfile"
        createdAt:
          type: string
          format: date-time
      required: [id, teacherId, type, status, title, skillLevel, priceInCents, currency, tags, isOnline, createdAt]

    ListingListResponse:
      type: object
      properties:
        listings:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        total:
          type: integer
      required: [listings, total]

    CreateListingBody:
      type: object
      properties:
        type:
          type: string
          enum: [lesson, event, masterclass, digital_product]
        title:
          type: string
        description:
          type: string
        instrument:
          type: string
        skillLevel:
          type: string
          enum: [beginner, intermediate, advanced, all]
        priceInCents:
          type: integer
        durationMinutes:
          type: integer
        imageUrl:
          type: string
        tags:
          type: array
          items:
            type: string
        isOnline:
          type: boolean
        city:
          type: string
        country:
          type: string
      required: [type, title, priceInCents]

    UpdateListingBody:
      type: object
      properties:
        status:
          type: string
          enum: [active, inactive, draft]
        title:
          type: string
        description:
          type: string
        instrument:
          type: string
        skillLevel:
          type: string
        priceInCents:
          type: integer
        durationMinutes:
          type: integer
        imageUrl:
          type: string
        tags:
          type: array
          items:
            type: string

    # ── Masterclass ───────────────────────────────────────────────────────────
    Masterclass:
      type: object
      properties:
        id:
          type: integer
        listingId:
          type: integer
        teacherId:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        maxPerformers:
          type: integer
        maxObservers:
          type: integer
        performerPriceInCents:
          type: integer
        observerPriceInCents:
          type: integer
        currency:
          type: string
        registeredPerformers:
          type: integer
        registeredObservers:
          type: integer
        meetingUrl:
          type: ["string", "null"]
        recordingUrl:
          type: ["string", "null"]
        isLive:
          type: boolean
        isCancelled:
          type: boolean
        instrument:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        teacher:
          $ref: "#/components/schemas/TeacherProfile"
        createdAt:
          type: string
          format: date-time
      required: [id, listingId, teacherId, title, scheduledAt, durationMinutes, maxPerformers, maxObservers, performerPriceInCents, observerPriceInCents, currency, registeredPerformers, registeredObservers, isLive, isCancelled, createdAt]

    MasterclassListResponse:
      type: object
      properties:
        masterclasses:
          type: array
          items:
            $ref: "#/components/schemas/Masterclass"
        total:
          type: integer
      required: [masterclasses, total]

    CreateMasterclassBody:
      type: object
      properties:
        listingId:
          type: integer
        title:
          type: string
        description:
          type: string
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        maxPerformers:
          type: integer
        maxObservers:
          type: integer
        performerPriceInCents:
          type: integer
        observerPriceInCents:
          type: integer
        instrument:
          type: string
        imageUrl:
          type: string
      required: [listingId, title, scheduledAt, performerPriceInCents, observerPriceInCents]

    UpdateMasterclassBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        meetingUrl:
          type: string
        isCancelled:
          type: boolean

    # ── Digital Product ───────────────────────────────────────────────────────
    DigitalProduct:
      type: object
      properties:
        id:
          type: integer
        listingId:
          type: integer
        teacherId:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: string
        instrument:
          type: ["string", "null"]
        difficulty:
          type: ["string", "null"]
        fileKey:
          type: ["string", "null"]
        fileSize:
          type: ["integer", "null"]
        fileType:
          type: ["string", "null"]
        previewUrl:
          type: ["string", "null"]
        downloadCount:
          type: integer
        isPublished:
          type: boolean
        priceInCents:
          type: integer
        currency:
          type: string
        teacher:
          $ref: "#/components/schemas/TeacherProfile"
        createdAt:
          type: string
          format: date-time
      required: [id, listingId, teacherId, title, category, downloadCount, isPublished, priceInCents, currency, createdAt]

    DigitalProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/DigitalProduct"
        total:
          type: integer
      required: [products, total]

    CreateDigitalProductBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        instrument:
          type: string
        difficulty:
          type: string
        priceInCents:
          type: integer
        previewUrl:
          type: string
        fileKey:
          type: string
        fileSize:
          type: integer
        fileType:
          type: string
        isPublished:
          type: boolean
      required: [title, category, priceInCents]

    UpdateDigitalProductBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        instrument:
          type: string
        difficulty:
          type: string
        priceInCents:
          type: integer
        previewUrl:
          type: string
        isPublished:
          type: boolean
        fileKey:
          type: string
        fileSize:
          type: integer
        fileType:
          type: string

    # ── Booking ───────────────────────────────────────────────────────────────
    Booking:
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: string
        teacherId:
          type: string
        listingId:
          type: ["integer", "null"]
        type:
          type: string
          enum: [lesson, event]
        status:
          type: string
          enum: [pending, confirmed, cancelled, completed, refunded, expired]
        scheduledAt:
          type: ["string", "null"]
          format: date-time
        durationMinutes:
          type: ["integer", "null"]
        priceInCents:
          type: integer
        currency:
          type: string
        notes:
          type: ["string", "null"]
        meetingUrl:
          type: ["string", "null"]
        instrument:
          type: ["string", "null"]
        eventType:
          type: ["string", "null"]
        eventDate:
          type: ["string", "null"]
          format: date-time
        eventLocation:
          type: ["string", "null"]
        cancelReason:
          type: ["string", "null"]
        platformFeeInCents:
          type: integer
          description: "Platform fee charged on this booking (in cents)"
        surgePercent:
          type: ["integer", "null"]
          description: "Surge percentage applied for last-minute bookings (e.g. 25 = 25%)"
        surgeAmountInCents:
          type: ["integer", "null"]
          description: "Absolute surge premium in cents (surgePercent % of base price)"
        expiresAt:
          type: ["string", "null"]
          format: date-time
          description: "Acceptance deadline for last-minute booking requests (null for standard bookings)"
        hasReview:
          type: boolean
          description: "Whether the student has already submitted a review for this booking"
        teacher:
          $ref: "#/components/schemas/TeacherProfile"
        createdAt:
          type: string
          format: date-time
      required: [id, studentId, teacherId, type, status, priceInCents, platformFeeInCents, currency, createdAt]

    BookingListResponse:
      type: object
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        total:
          type: integer
      required: [bookings, total]

    CreateBookingBody:
      type: object
      properties:
        teacherId:
          type: string
        listingId:
          type: integer
        type:
          type: string
          enum: [lesson, event]
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        notes:
          type: string
        instrument:
          type: string
        eventType:
          type: string
        eventDate:
          type: string
          format: date-time
        eventLocation:
          type: string
      required: [teacherId, type]

    UpdateBookingBody:
      type: object
      properties:
        status:
          type: string
          enum: [confirmed, cancelled, completed, expired]
        meetingUrl:
          type: string
        cancelReason:
          type: string
        scheduledAt:
          type: string
          format: date-time

    # ── Order ─────────────────────────────────────────────────────────────────
    Order:
      type: object
      properties:
        id:
          type: integer
        buyerId:
          type: string
        sellerId:
          type: string
        type:
          type: string
          enum: [digital_product, masterclass_performer, masterclass_observer]
        status:
          type: string
          enum: [pending, paid, refunded, failed]
        digitalProductId:
          type: ["integer", "null"]
        masterclassEventId:
          type: ["integer", "null"]
        priceInCents:
          type: integer
        currency:
          type: string
        downloadUrl:
          type: ["string", "null"]
        downloadExpiresAt:
          type: ["string", "null"]
          format: date-time
        downloadCount:
          type: integer
        paidAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, buyerId, sellerId, type, status, priceInCents, currency, downloadCount, createdAt]

    OrderListResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
      required: [orders, total]

    CreateOrderBody:
      type: object
      properties:
        type:
          type: string
          enum: [digital_product, masterclass_performer, masterclass_observer]
        digitalProductId:
          type: integer
        masterclassEventId:
          type: integer
      required: [type]

    # ── Review ────────────────────────────────────────────────────────────────
    Review:
      type: object
      properties:
        id:
          type: integer
        reviewerId:
          type: string
        teacherId:
          type: string
        bookingId:
          type: ["integer", "null"]
        rating:
          type: integer
        title:
          type: ["string", "null"]
        body:
          type: ["string", "null"]
        isPublished:
          type: boolean
        reviewer:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time
      required: [id, reviewerId, teacherId, rating, isPublished, createdAt]

    ReviewListResponse:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        total:
          type: integer
      required: [reviews, total]

    CreateReviewBody:
      type: object
      properties:
        teacherId:
          type: string
        bookingId:
          type: integer
        rating:
          type: integer
        title:
          type: string
        body:
          type: string
      required: [teacherId, rating]

    # ── Dashboard ─────────────────────────────────────────────────────────────
    TeacherDashboard:
      type: object
      properties:
        upcomingBookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        recentReviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        totalEarningsInCents:
          type: integer
        totalStudents:
          type: integer
        totalLessonsCompleted:
          type: integer
        averageRating:
          type: integer
        activeListingsCount:
          type: integer
        upcomingMasterclasses:
          type: array
          items:
            $ref: "#/components/schemas/Masterclass"
      required: [upcomingBookings, recentReviews, totalEarningsInCents, totalStudents, totalLessonsCompleted, averageRating, activeListingsCount, upcomingMasterclasses]

    StudentDashboard:
      type: object
      properties:
        upcomingBookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        registeredMasterclasses:
          type: array
          items:
            $ref: "#/components/schemas/Masterclass"
        lessonsCompleted:
          type: integer
        totalSpentInCents:
          type: integer
        favouriteTeachers:
          type: array
          items:
            $ref: "#/components/schemas/TeacherProfile"
      required: [upcomingBookings, recentOrders, registeredMasterclasses, lessonsCompleted, totalSpentInCents, favouriteTeachers]

    # ── Stripe ────────────────────────────────────────────────────────────────
    CreateBookingCheckoutBody:
      type: object
      properties:
        bookingId:
          type: integer
        successUrl:
          type: string
        cancelUrl:
          type: string
      required: [bookingId, successUrl, cancelUrl]

    CreateOrderCheckoutBody:
      type: object
      properties:
        orderId:
          type: integer
        successUrl:
          type: string
        cancelUrl:
          type: string
      required: [orderId, successUrl, cancelUrl]

    CreateConnectOnboardingBody:
      type: object
      properties:
        returnUrl:
          type: string
      required: [returnUrl]

    CheckoutUrlResponse:
      type: object
      properties:
        checkoutUrl:
          type: string
      required: [checkoutUrl]

    OnboardingUrlResponse:
      type: object
      properties:
        onboardingUrl:
          type: string
      required: [onboardingUrl]

    ConnectStatusResponse:
      type: object
      properties:
        isConnected:
          type: boolean
        isOnboarded:
          type: boolean
        stripeAccountId:
          type: ["string", "null"]
        balanceAvailableInCents:
          type: integer
          description: Available balance in cents (USD) from Stripe Connect account
        balancePendingInCents:
          type: integer
          description: Pending balance in cents (USD) from Stripe Connect account
        currency:
          type: string
          description: Currency code for balance amounts
      required: [isConnected, isOnboarded]

    DashboardUrlResponse:
      type: object
      properties:
        dashboardUrl:
          type: string
      required: [dashboardUrl]

    # ── Storage ────────────────────────────────────────────────────────────────
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file.
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Video Reels ────────────────────────────────────────────────────────────
    VideoReel:
      type: object
      properties:
        id:
          type: integer
        teacherId:
          type: string
        rawFileUrl:
          type: string
        processedFileUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [uploading, queued, processing, ready, failed]
        genre:
          type: ["string", "null"]
        instruments:
          type: array
          items:
            type: string
        webhookSecret:
          type: string
        errorMessage:
          type: ["string", "null"]
        archivedFileUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, teacherId, rawFileUrl, status, instruments, webhookSecret, createdAt, updatedAt]

    VideoReelOrNull:
      oneOf:
        - $ref: "#/components/schemas/VideoReel"
        - type: "null"

    VideoReelOwner:
      type: object
      description: Teacher-facing reel — omits server-internal fields (webhookSecret, rawFileUrl).
      properties:
        id:
          type: integer
        teacherId:
          type: string
        processedFileUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [uploading, queued, processing, ready, failed]
        genre:
          type: ["string", "null"]
        instruments:
          type: array
          items:
            type: string
        errorMessage:
          type: ["string", "null"]
        archivedFileUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, teacherId, status, instruments, createdAt, updatedAt]

    VideoReelOwnerOrNull:
      oneOf:
        - $ref: "#/components/schemas/VideoReelOwner"
        - type: "null"

    VideoReelPublic:
      type: object
      description: Safe public view of a reel — sensitive fields (webhookSecret, rawFileUrl) are never included.
      properties:
        id:
          type: integer
        teacherId:
          type: string
        processedFileUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [uploading, queued, processing, ready, failed]
        genre:
          type: ["string", "null"]
        instruments:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, teacherId, status, instruments, createdAt, updatedAt]

    VideoReelPublicOrNull:
      oneOf:
        - $ref: "#/components/schemas/VideoReelPublic"
        - type: "null"

    ReelCallbackBody:
      type: object
      properties:
        reelId:
          type: integer
        webhookSecret:
          type: string
        status:
          type: string
          enum: [processing, ready, failed]
        processedFileUrl:
          type: string
        error:
          type: string
      required: [reelId, webhookSecret, status]

    ReelCallbackAck:
      type: object
      description: Acknowledgement returned by the callback endpoint — always 200.
      properties:
        ok:
          type: boolean
        message:
          type: string
      required: [ok]

    # ── Download ───────────────────────────────────────────────────────────────
    DownloadRedirectResponse:
      type: object
      required: [downloadUrl]
      properties:
        downloadUrl:
          type: string
          description: Signed download URL for the file.
