      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                genre:
                  type: string
                instruments:
                  type: string
                  description: Comma-separated list of instruments
                clipStart:
                  type: number
                  description: Optional start time in seconds for the clip the musician wants to highlight
                clipEnd:
                  type: number
                  description: Optional end time in seconds for the clip the musician wants to highlight
      responses:
        "201":
          description: Reel created and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoReelOwner"
        "400":
          $ref: "#/components/responses/BadRequest"
