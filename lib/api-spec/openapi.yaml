openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Classical Music Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: audio-enhancement
    description: Recording enhancement jobs
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: teachers
    description: Teacher profile operations
  - name: students
    description: Student profile operations
  - name: listings
    description: Listing operations
  - name: masterclasses
    description: Masterclass event operations
  - name: digital-products
    description: Digital product operations
  - name: bookings
    description: Booking operations
  - name: orders
    description: Order operations
  - name: reviews
    description: Review operations
  - name: dashboard
    description: Dashboard summary operations
  - name: stripe
    description: Stripe payment and Connect operations
  - name: storage
    description: Object storage upload and serving endpoints
  - name: reels
    description: Booking reel upload and processing operations
  - name: subscriptions
    description: Business Suite SaaS subscription management
  - name: contracts
    description: Business Suite contract creation and e-signing
  - name: invoices
    description: Business Suite invoice generation and delivery
  - name: expenses
    description: Business Suite expense tracking
  - name: audition-programs
    description: Audition Prep Coaching Track programs and enrollments
  - name: orgs
    description: Music school & studio white-label organisations
  - name: scores
    description: Original score marketplace — composer listing and buyer licensing
  - name: practice
    description: Practice partner matching — profiles, requests, sessions
  - name: live-concerts
  - name: ensembles
    description: Pay-per-view live concert streaming

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Users ──────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/onboard:
    post:
      operationId: onboardUser
      tags: [users]
      summary: Set role and create profile after signup
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardUserBody"
      responses:
        "200":
          description: Onboarded user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Teacher Profiles ───────────────────────────────────────────────────────
  /teachers:
    get:
      operationId: listTeachers
      tags: [teachers]
      summary: Browse teacher profiles
      parameters:
        - name: instrument
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: listingType
          in: query
          schema:
            type: string
            enum: [lesson, event, masterclass, digital_product, coaching]
        - name: dayOfWeek
          in: query
          description: "Filter teachers by the day of week they have masterclass events scheduled (0=Sunday, 1=Monday, ..., 6=Saturday). When listingType is 'lesson', 'event', or 'digital_product', this parameter is ignored because those listing types have no rows in masterclass_events — all matching teachers are returned regardless of this value."
          schema:
            type: integer
            minimum: 0
            maximum: 6
        - name: instruments
          in: query
          description: "Comma-separated list of instruments to filter by (matches any). Takes precedence over `instrument` when provided."
          schema:
            type: string
        - name: minRate
          in: query
          schema:
            type: integer
        - name: maxRate
          in: query
          schema:
            type: integer
        - name: onlineOnly
          in: query
          description: "When true, only return teachers who have at least one active online listing."
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: orgSlug
          in: query
          description: "When provided, filter results to teachers belonging to this organisation. School-private orgs only return their own teachers. Public-marketplace orgs return their teachers plus unaffiliated teachers."
          schema:
            type: string
      responses:
        "200":
          description: List of teachers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherListResponse"

  /teachers/{userId}:
    get:
      operationId: getTeacher
      tags: [teachers]
      summary: Get a teacher profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /teachers/by-slug/{slug}:
    get:
      operationId: getTeacherBySlug
      tags: [teachers]
      summary: Get a teacher profile by vanity slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /teachers/me/slug:
    put:
      operationId: updateMyTeacherSlug
      tags: [teachers]
      summary: Set or update the teacher's vanity URL slug
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeacherSlugBody"
      responses:
        "200":
          description: Updated teacher profile with new slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Slug already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /teachers/{teacherId}/recordings:
    get:
      operationId: getTeacherRecordings
      tags: [teachers]
      summary: Get recordings for a teacher
      parameters:
        - name: teacherId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of recordings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherRecordingListResponse"

  /teachers/me/recordings:
    post:
      operationId: createTeacherRecording
      tags: [teachers]
      summary: Add a recording to the teacher's profile (max 5)
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeacherRecordingBody"
      responses:
        "201":
          description: Created recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherRecording"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /teachers/me/recordings/{id}:
    delete:
      operationId: deleteTeacherRecording
      tags: [teachers]
      summary: Remove a recording from the teacher's profile
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /teachers/me:
    get:
      operationId: getMyTeacherProfile
      tags: [teachers]
      summary: Get current teacher profile
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateMyTeacherProfile
      tags: [teachers]
      summary: Update current teacher profile
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeacherProfileBody"
      responses:
        "200":
          description: Updated teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Student Profiles ───────────────────────────────────────────────────────
  /students/me:
    get:
      operationId: getMyStudentProfile
      tags: [students]
      summary: Get current student profile
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateMyStudentProfile
      tags: [students]
      summary: Update current student profile
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentProfileBody"
      responses:
        "200":
          description: Updated student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Listings ───────────────────────────────────────────────────────────────
  /listings:
    get:
      operationId: listListings
      tags: [listings]
      summary: Browse all listings
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [lesson, event, masterclass, digital_product, coaching]
        - name: instrument
          in: query
          schema:
            type: string
        - name: skillLevel
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: isOnline
          in: query
          schema:
            type: boolean
        - name: dayOfWeek
          in: query
          description: "Filter masterclass listings by day of week (0=Sunday, 1=Monday, ..., 6=Saturday). Only masterclass listings are filtered by this value because they have rows in the masterclass_events table. Listings of type 'lesson', 'event', and 'digital_product' are always included regardless of this filter — they have no fixed schedule stored in masterclass_events."
          schema:
            type: integer
            minimum: 0
            maximum: 6
        - name: minPrice
          in: query
          schema:
            type: integer
        - name: maxPrice
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: orgSlug
          in: query
          description: Filter listings to a specific school org portal. Private orgs require caller to be an enrolled member.
          schema:
            type: string
      responses:
        "200":
          description: List of listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingListResponse"

    post:
      operationId: createListing
      tags: [listings]
      summary: Create a new listing
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingBody"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      summary: Get a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateListing
      tags: [listings]
      summary: Update a listing
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListingBody"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteListing
      tags: [listings]
      summary: Delete a listing
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /listings/teacher/{userId}:
    get:
      operationId: getTeacherListings
      tags: [listings]
      summary: Get all listings for a teacher
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Teacher's listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingListResponse"

  # ── Masterclasses ──────────────────────────────────────────────────────────
  /masterclasses:
    get:
      operationId: listMasterclasses
      tags: [masterclasses]
      summary: Browse upcoming masterclass events
      parameters:
        - name: instrument
          in: query
          schema:
            type: string
        - name: dayOfWeek
          in: query
          description: "Filter masterclass events by day of week (0=Sunday, 1=Monday, ..., 6=Saturday). Only returns masterclasses whose next occurrence falls on the specified day."
          schema:
            type: integer
            minimum: 0
            maximum: 6
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of masterclasses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterclassListResponse"

    post:
      operationId: createMasterclass
      tags: [masterclasses]
      summary: Create a masterclass event
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMasterclassBody"
      responses:
        "201":
          description: Created masterclass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Masterclass"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /masterclasses/{id}:
    get:
      operationId: getMasterclass
      tags: [masterclasses]
      summary: Get a masterclass event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Masterclass event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Masterclass"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateMasterclass
      tags: [masterclasses]
      summary: Update a masterclass event
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMasterclassBody"
      responses:
        "200":
          description: Updated masterclass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Masterclass"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Live Concerts ──────────────────────────────────────────────────────────
  /live-concerts:
    get:
      operationId: listLiveConcerts
      tags: [live-concerts]
      summary: Browse upcoming and live pay-per-view concerts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of live concerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveConcertListResponse"

    post:
      operationId: createLiveConcert
      tags: [live-concerts]
      summary: Create a live concert event (teacher only)
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLiveConcertBody"
      responses:
        "201":
          description: Created live concert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveConcert"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /live-concerts/mine:
    get:
      operationId: listMyLiveConcerts
      tags: [live-concerts]
      summary: Get the authenticated teacher's concerts with revenue stats
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Teacher's concerts with revenue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyLiveConcertsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /live-concerts/{id}:
    get:
      operationId: getLiveConcert
      tags: [live-concerts]
      summary: Get a live concert by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Live concert detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveConcert"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateLiveConcert
      tags: [live-concerts]
      summary: Update a live concert (teacher owner only)
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLiveConcertBody"
      responses:
        "200":
          description: Updated live concert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveConcert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /live-concerts/{id}/my-ticket:
    get:
      operationId: getMyLiveConcertTicket
      tags: [live-concerts]
      summary: Check whether the authenticated user holds a paid ticket for this concert
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyLiveConcertTicketResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Ensembles ──────────────────────────────────────────────────────────────
  /ensembles:
    get:
      operationId: listEnsembles
      tags: [ensembles]
      summary: Browse public ensembles
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of ensembles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnsembleListResponse"
    post:
      operationId: createEnsemble
      tags: [ensembles]
      summary: Create a new ensemble
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnsembleBody"
      responses:
        "201":
          description: Created ensemble
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnsembleWithMembers"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ensembles/mine:
    get:
      operationId: listMyEnsembles
      tags: [ensembles]
      summary: List ensembles the authenticated teacher leads or is a member of
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: My ensembles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnsembleListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ensembles/{slug}:
    get:
      operationId: getEnsemble
      tags: [ensembles]
      summary: Get a public ensemble profile by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ensemble profile with members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnsembleWithMembers"
        "404":
          $ref: "#/components/responses/NotFound"

  /ensembles/{id}/update:
    put:
      operationId: updateEnsemble
      tags: [ensembles]
      summary: Update an ensemble (leader only)
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnsembleBody"
      responses:
        "200":
          description: Updated ensemble
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnsembleWithMembers"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ensembles/{id}/listings/{listingId}:
    put:
      operationId: linkEnsembleListing
      tags: [ensembles]
      summary: Associate an event listing with this ensemble (leader only)
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  listingId:
                    type: integer
                  ensembleId:
                    type: integer
                required: [ok, listingId, ensembleId]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unlinkEnsembleListing
      tags: [ensembles]
      summary: Detach an event listing from this ensemble (leader only)
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Listing detached
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ensembles/{id}/invite:
    post:
      operationId: inviteEnsembleMember
      tags: [ensembles]
      summary: Invite a teacher to join an ensemble by email
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteEnsembleMemberBody"
      responses:
        "201":
