openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Classical Music Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: teachers
    description: Teacher profile operations
  - name: students
    description: Student profile operations
  - name: listings
    description: Listing operations
  - name: masterclasses
    description: Masterclass event operations
  - name: digital-products
    description: Digital product operations
  - name: bookings
    description: Booking operations
  - name: orders
    description: Order operations
  - name: reviews
    description: Review operations
  - name: dashboard
    description: Dashboard summary operations
  - name: stripe
    description: Stripe payment and Connect operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Users ──────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/onboard:
    post:
      operationId: onboardUser
      tags: [users]
      summary: Set role and create profile after signup
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardUserBody"
      responses:
        "200":
          description: Onboarded user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Teacher Profiles ───────────────────────────────────────────────────────
  /teachers:
    get:
      operationId: listTeachers
      tags: [teachers]
      summary: Browse teacher profiles
      parameters:
        - name: instrument
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: minRate
          in: query
          schema:
            type: integer
        - name: maxRate
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of teachers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherListResponse"

  /teachers/{userId}:
    get:
      operationId: getTeacher
      tags: [teachers]
      summary: Get a teacher profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /teachers/me:
    get:
      operationId: getMyTeacherProfile
      tags: [teachers]
      summary: Get current teacher profile
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateMyTeacherProfile
      tags: [teachers]
      summary: Update current teacher profile
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeacherProfileBody"
      responses:
        "200":
          description: Updated teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Student Profiles ───────────────────────────────────────────────────────
  /students/me:
    get:
      operationId: getMyStudentProfile
      tags: [students]
      summary: Get current student profile
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateMyStudentProfile
      tags: [students]
      summary: Update current student profile
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentProfileBody"
      responses:
        "200":
          description: Updated student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Listings ───────────────────────────────────────────────────────────────
  /listings:
    get:
      operationId: listListings
      tags: [listings]
      summary: Browse all listings
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [lesson, event, masterclass, digital_product]
        - name: instrument
          in: query
          schema:
            type: string
        - name: skillLevel
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: integer
        - name: maxPrice
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingListResponse"

    post:
      operationId: createListing
      tags: [listings]
      summary: Create a new listing
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingBody"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      summary: Get a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateListing
      tags: [listings]
      summary: Update a listing
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListingBody"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteListing
      tags: [listings]
      summary: Delete a listing
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /listings/teacher/{userId}:
    get:
      operationId: getTeacherListings
      tags: [listings]
      summary: Get all listings for a teacher
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Teacher's listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingListResponse"

  # ── Masterclasses ──────────────────────────────────────────────────────────
  /masterclasses:
    get:
      operationId: listMasterclasses
      tags: [masterclasses]
      summary: Browse upcoming masterclass events
      parameters:
        - name: instrument
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of masterclasses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterclassListResponse"

    post:
      operationId: createMasterclass
      tags: [masterclasses]
      summary: Create a masterclass event
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMasterclassBody"
      responses:
        "201":
          description: Created masterclass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Masterclass"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /masterclasses/{id}:
    get:
      operationId: getMasterclass
      tags: [masterclasses]
      summary: Get a masterclass event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Masterclass event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Masterclass"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateMasterclass
      tags: [masterclasses]
      summary: Update a masterclass event
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMasterclassBody"
      responses:
        "200":
          description: Updated masterclass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Masterclass"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Digital Products ───────────────────────────────────────────────────────
  /digital-products:
    get:
      operationId: listDigitalProducts
      tags: [digital-products]
      summary: Browse digital products
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: instrument
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of digital products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalProductListResponse"

    post:
      operationId: createDigitalProduct
      tags: [digital-products]
      summary: Create a digital product listing
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDigitalProductBody"
      responses:
        "201":
          description: Created digital product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /digital-products/{id}:
    get:
      operationId: getDigitalProduct
      tags: [digital-products]
      summary: Get a digital product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Digital product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalProduct"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateDigitalProduct
      tags: [digital-products]
      summary: Update a digital product
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDigitalProductBody"
      responses:
        "200":
          description: Updated digital product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Bookings ───────────────────────────────────────────────────────────────
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings for current user
      security: [{ clerkAuth: [] }]
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking request
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBody"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a booking
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Update booking status
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingBody"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Orders ─────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for current user
      security: [{ clerkAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order (digital product or masterclass ticket)
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Reviews ────────────────────────────────────────────────────────────────
  /reviews/teacher/{userId}:
    get:
      operationId: getTeacherReviews
      tags: [reviews]
      summary: Get reviews for a teacher
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"

  /reviews:
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a review
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Dashboard ──────────────────────────────────────────────────────────────
  /dashboard/teacher:
    get:
      operationId: getTeacherDashboard
      tags: [dashboard]
      summary: Get teacher dashboard summary
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Teacher dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/student:
    get:
      operationId: getStudentDashboard
      tags: [dashboard]
      summary: Get student dashboard summary
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Student dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Stripe ─────────────────────────────────────────────────────────────────
  /stripe/checkout/booking:
    post:
      operationId: createBookingCheckout
      tags: [stripe]
      summary: Create Stripe Checkout session for a lesson or event booking
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingCheckoutBody"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /stripe/checkout/order:
    post:
      operationId: createOrderCheckout
      tags: [stripe]
      summary: Create Stripe Checkout session for an order (masterclass or digital product)
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderCheckoutBody"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /stripe/connect/onboard:
    post:
      operationId: createConnectOnboarding
      tags: [stripe]
      summary: Start Stripe Connect Express onboarding for a teacher
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectOnboardingBody"
      responses:
        "200":
          description: Onboarding URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingUrlResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /stripe/connect/status:
    get:
      operationId: getConnectStatus
      tags: [stripe]
      summary: Get teacher Stripe Connect account status
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Connect status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /stripe/connect/dashboard:
    get:
      operationId: getConnectDashboard
      tags: [stripe]
      summary: Get Stripe Express Dashboard login link for a teacher
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Dashboard URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    # ── User ────────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
          enum: [teacher, student, null]
        createdAt:
          type: string
          format: date-time
      required: [id, email, createdAt]

    OnboardUserBody:
      type: object
      properties:
        role:
          type: string
          enum: [teacher, student]
        firstName:
          type: string
        lastName:
          type: string
      required: [role]

    # ── Teacher Profile ──────────────────────────────────────────────────────
    TeacherProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        bio:
          type: ["string", "null"]
        instruments:
          type: array
          items:
            type: string
        genres:
          type: array
          items:
            type: string
        city:
          type: ["string", "null"]
        country:
