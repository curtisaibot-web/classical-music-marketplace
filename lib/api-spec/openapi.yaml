openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Classical Music Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: teachers
    description: Teacher profile operations
  - name: students
    description: Student profile operations
  - name: listings
    description: Listing operations
  - name: masterclasses
    description: Masterclass event operations
  - name: digital-products
    description: Digital product operations
  - name: bookings
    description: Booking operations
  - name: orders
    description: Order operations
  - name: reviews
    description: Review operations
  - name: dashboard
    description: Dashboard summary operations
  - name: stripe
    description: Stripe payment and Connect operations
  - name: storage
    description: Object storage upload and serving endpoints
  - name: reels
    description: Booking reel upload and processing operations
  - name: subscriptions
    description: Business Suite SaaS subscription management
  - name: contracts
    description: Business Suite contract creation and e-signing
  - name: invoices
    description: Business Suite invoice generation and delivery
  - name: expenses
    description: Business Suite expense tracking
  - name: audition-programs
    description: Audition Prep Coaching Track programs and enrollments
  - name: orgs
    description: Music school & studio white-label organisations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Users ──────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/onboard:
    post:
      operationId: onboardUser
      tags: [users]
      summary: Set role and create profile after signup
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardUserBody"
      responses:
        "200":
          description: Onboarded user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Teacher Profiles ───────────────────────────────────────────────────────
  /teachers:
    get:
      operationId: listTeachers
      tags: [teachers]
      summary: Browse teacher profiles
      parameters:
        - name: instrument
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: listingType
          in: query
          schema:
            type: string
            enum: [lesson, event, masterclass, digital_product]
        - name: dayOfWeek
          in: query
          description: "Filter teachers by the day of week they have masterclass events scheduled (0=Sunday, 1=Monday, ..., 6=Saturday). When listingType is 'lesson', 'event', or 'digital_product', this parameter is ignored because those listing types have no rows in masterclass_events — all matching teachers are returned regardless of this value."
          schema:
            type: integer
            minimum: 0
            maximum: 6
        - name: instruments
          in: query
          description: "Comma-separated list of instruments to filter by (matches any). Takes precedence over `instrument` when provided."
          schema:
            type: string
        - name: minRate
          in: query
          schema:
            type: integer
        - name: maxRate
          in: query
          schema:
            type: integer
        - name: onlineOnly
          in: query
          description: "When true, only return teachers who have at least one active online listing."
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: orgSlug
          in: query
          description: "When provided, filter results to teachers belonging to this organisation. School-private orgs only return their own teachers. Public-marketplace orgs return their teachers plus unaffiliated teachers."
          schema:
            type: string
      responses:
        "200":
          description: List of teachers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherListResponse"

  /teachers/{userId}:
    get:
      operationId: getTeacher
      tags: [teachers]
      summary: Get a teacher profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /teachers/by-slug/{slug}:
    get:
      operationId: getTeacherBySlug
      tags: [teachers]
      summary: Get a teacher profile by vanity slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /teachers/me/slug:
    put:
      operationId: updateMyTeacherSlug
      tags: [teachers]
      summary: Set or update the teacher's vanity URL slug
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeacherSlugBody"
      responses:
        "200":
          description: Updated teacher profile with new slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Slug already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /teachers/{teacherId}/recordings:
    get:
      operationId: getTeacherRecordings
      tags: [teachers]
      summary: Get recordings for a teacher
      parameters:
        - name: teacherId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of recordings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherRecordingListResponse"

  /teachers/me/recordings:
    post:
      operationId: createTeacherRecording
      tags: [teachers]
      summary: Add a recording to the teacher's profile (max 5)
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeacherRecordingBody"
      responses:
        "201":
          description: Created recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherRecording"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /teachers/me/recordings/{id}:
    delete:
      operationId: deleteTeacherRecording
      tags: [teachers]
      summary: Remove a recording from the teacher's profile
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /teachers/me:
    get:
      operationId: getMyTeacherProfile
      tags: [teachers]
      summary: Get current teacher profile
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateMyTeacherProfile
      tags: [teachers]
      summary: Update current teacher profile
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeacherProfileBody"
      responses:
        "200":
          description: Updated teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Student Profiles ───────────────────────────────────────────────────────
  /students/me:
    get:
      operationId: getMyStudentProfile
      tags: [students]
      summary: Get current student profile
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateMyStudentProfile
      tags: [students]
      summary: Update current student profile
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentProfileBody"
      responses:
        "200":
          description: Updated student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Listings ───────────────────────────────────────────────────────────────
  /listings:
    get:
      operationId: listListings
      tags: [listings]
      summary: Browse all listings
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [lesson, event, masterclass, digital_product]
        - name: instrument
          in: query
          schema:
            type: string
        - name: skillLevel
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: isOnline
          in: query
          schema:
            type: boolean
        - name: dayOfWeek
          in: query
          description: "Filter masterclass listings by day of week (0=Sunday, 1=Monday, ..., 6=Saturday). Only masterclass listings are filtered by this value because they have rows in the masterclass_events table. Listings of type 'lesson', 'event', and 'digital_product' are always included regardless of this filter — they have no fixed schedule stored in masterclass_events."
          schema:
            type: integer
            minimum: 0
            maximum: 6
        - name: minPrice
          in: query
          schema:
            type: integer
        - name: maxPrice
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: orgSlug
          in: query
          description: Filter listings to a specific school org portal. Private orgs require caller to be an enrolled member.
          schema:
            type: string
      responses:
        "200":
          description: List of listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingListResponse"

    post:
      operationId: createListing
      tags: [listings]
      summary: Create a new listing
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingBody"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      summary: Get a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateListing
      tags: [listings]
      summary: Update a listing
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListingBody"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteListing
      tags: [listings]
      summary: Delete a listing
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /listings/teacher/{userId}:
    get:
      operationId: getTeacherListings
      tags: [listings]
      summary: Get all listings for a teacher
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Teacher's listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingListResponse"

  # ── Masterclasses ──────────────────────────────────────────────────────────
  /masterclasses:
    get:
      operationId: listMasterclasses
      tags: [masterclasses]
      summary: Browse upcoming masterclass events
      parameters:
        - name: instrument
          in: query
          schema:
            type: string
        - name: dayOfWeek
          in: query
          description: "Filter masterclass events by day of week (0=Sunday, 1=Monday, ..., 6=Saturday). Only returns masterclasses whose next occurrence falls on the specified day."
          schema:
            type: integer
            minimum: 0
            maximum: 6
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of masterclasses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterclassListResponse"

    post:
      operationId: createMasterclass
      tags: [masterclasses]
      summary: Create a masterclass event
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMasterclassBody"
      responses:
        "201":
          description: Created masterclass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Masterclass"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /masterclasses/{id}:
    get:
      operationId: getMasterclass
      tags: [masterclasses]
      summary: Get a masterclass event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Masterclass event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Masterclass"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateMasterclass
      tags: [masterclasses]
      summary: Update a masterclass event
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMasterclassBody"
      responses:
        "200":
          description: Updated masterclass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Masterclass"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Digital Products ───────────────────────────────────────────────────────
  /digital-products:
    get:
      operationId: listDigitalProducts
      tags: [digital-products]
      summary: Browse digital products
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: instrument
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of digital products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalProductListResponse"

    post:
      operationId: createDigitalProduct
      tags: [digital-products]
      summary: Create a digital product listing
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDigitalProductBody"
      responses:
        "201":
          description: Created digital product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /digital-products/{id}:
    get:
      operationId: getDigitalProduct
      tags: [digital-products]
      summary: Get a digital product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Digital product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalProduct"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateDigitalProduct
      tags: [digital-products]
      summary: Update a digital product
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDigitalProductBody"
      responses:
        "200":
          description: Updated digital product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Bookings ───────────────────────────────────────────────────────────────
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings for current user
      security: [{ clerkAuth: [] }]
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking request
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBody"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a booking
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Update booking status
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingBody"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Orders ─────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for current user
      security: [{ clerkAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order (digital product or masterclass ticket)
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{id}/download:
    get:
      operationId: getOrderDownload
      tags: [orders]
      summary: Get a signed download URL for a purchased digital product
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Signed download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadRedirectResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Download link has expired

  # ── Storage ────────────────────────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for file upload
      security: [{ clerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          $ref: "#/components/responses/BadRequest"
        '500':
          description: Failed to generate upload URL.

  # ── Reviews ────────────────────────────────────────────────────────────────
  /reviews/teacher/{userId}:
    get:
      operationId: getTeacherReviews
      tags: [reviews]
      summary: Get reviews for a teacher
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
