  /practice/partnerships/{id}/decline:
    post:
      operationId: declinePracticeRequest
      tags: [practice]
      summary: Decline or cancel a practice request
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request declined
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /practice/partnerships/{id}/dissolve:
    post:
      operationId: dissolvePracticePartnership
      tags: [practice]
      summary: Dissolve an active practice partnership
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated partnership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticePartnership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /practice/notifications:
    get:
      operationId: getPracticeNotifications
      tags: [practice]
      summary: Get badge counts and notification feed for items requiring the user's attention
      security: [{ clerkAuth: [] }]
      responses:
        "200":
          description: Notification counts and feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  incomingRequests:
                    type: integer
                  pendingSessionsAwaitingMe:
                    type: integer
                  unreadNotifications:
                    type: integer
                  total:
                    type: integer
                  recentNotifications:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        userId:
                          type: string
                        type:
                          type: string
                        message:
                          type: string
                        isRead:
                          type: boolean
                        partnershipId:
                          type: ["integer", "null"]
                        createdAt:
                          type: string
                          format: date-time
                      required: [id, userId, type, message, isRead, createdAt]
                required: [incomingRequests, pendingSessionsAwaitingMe, unreadNotifications, total, recentNotifications]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /practice/partnerships/{id}/sessions:
    post:
      operationId: proposePracticeSession
      tags: [practice]
      summary: Propose a new practice session
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposePracticeSessionBody"
      responses:
        "201":
          description: Proposed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      operationId: listPartnershipSessions
      tags: [practice]
      summary: List sessions for a partnership (includes caller's private completion record)
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of sessions with per-caller completion
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/PracticeSessionWithCompletion"
                required: [sessions]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /practice/sessions/{id}/confirm:
    post:
      operationId: confirmPracticeSession
      tags: [practice]
      summary: Confirm a proposed practice session
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                joinLink:
                  type: string
      responses:
        "200":
          description: Confirmed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /practice/sessions/{id}/complete:
    post:
      operationId: completePracticeSession
      tags: [practice]
      summary: Record the caller's completion of a session (private notes per user). Session status becomes "completed" once both partners have completed.
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        "200":
          description: Per-user completion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSessionCompleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /practice/sessions/{id}/join-link:
    put:
      operationId: updateSessionJoinLink
      tags: [practice]
      summary: Update the Zoom/Meet join link for a session
      security: [{ clerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                joinLink:
                  type: string
              required: [joinLink]
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    # ── User ────────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
          enum: [teacher, student, null]
        createdAt:
          type: string
          format: date-time
      required: [id, email, createdAt]

    OnboardUserBody:
      type: object
      properties:
        role:
          type: string
          enum: [teacher, student]
        firstName:
          type: string
        lastName:
          type: string
      required: [role]

    # ── Coach Profile ────────────────────────────────────────────────────────
    CoachProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        bio:
          type: ["string", "null"]
        credentials:
          type: ["string", "null"]
        specialties:
          type: array
          items:
            type: string
        linkedInUrl:
          type: ["string", "null"]
        approvalStatus:
          type: string
          enum: [pending, approved, rejected]
        sessionRateCents:
          type: ["integer", "null"]
        isOnline:
          type: boolean
        city:
          type: ["string", "null"]
        averageRating:
          type: ["integer", "null"]
        reviewCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, userId, approvalStatus, isOnline, reviewCount, createdAt]

    CoachApplyBody:
      type: object
      properties:
        bio:
          type: string
        credentials:
          type: string
        specialties:
          type: array
          items:
            type: string
        linkedInUrl:
          type: string
        sessionRateCents:
          type: integer
        isOnline:
          type: boolean
        city:
          type: string
      required: [bio]

    CoachWithUser:
      allOf:
        - $ref: "#/components/schemas/CoachProfile"
        - type: object
          properties:
            user:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                firstName:
                  type: ["string", "null"]
                lastName:
                  type: ["string", "null"]
                profileImageUrl:
                  type: ["string", "null"]

    CoachWithUserAndListings:
      allOf:
        - $ref: "#/components/schemas/CoachWithUser"
        - type: object
          properties:
            listings:
              type: array
              items:
                $ref: "#/components/schemas/Listing"
          required: [listings]

    # ── Teacher Profile ──────────────────────────────────────────────────────
    TeacherProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        bio:
          type: ["string", "null"]
        instruments:
          type: array
          items:
            type: string
        genres:
          type: array
          items:
            type: string
        city:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        timezone:
          type: ["string", "null"]
        hourlyRate:
          type: ["integer", "null"]
        currency:
          type: string
        yearsExperience:
          type: ["integer", "null"]
        education:
          type: ["string", "null"]
        averageRating:
          type: integer
        reviewCount:
          type: integer
        isVerified:
          type: boolean
        profileImageUrl:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        videoIntroUrl:
          type: ["string", "null"]
        profileSlug:
          type: ["string", "null"]
        stripeOnboarded:
          type: boolean
        isProSubscriber:
          type: boolean
        cancellationPolicyHours:
          type: integer
        cancellationFeePercent:
          type: integer
        isPubliclyVisible:
          type: boolean
          description: Whether this teacher opts into appearing on the public marketplace. Defaults to true. Private-org teachers with this set to false are only discoverable and bookable within their school.
        orgId:
          type: ["integer", "null"]
          description: The organisation this teacher belongs to, if any.
        user:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time
      required: [id, userId, instruments, genres, currency, averageRating, reviewCount, isVerified, stripeOnboarded, isPubliclyVisible, createdAt]

    TeacherListResponse:
      type: object
      properties:
        teachers:
          type: array
          items:
            $ref: "#/components/schemas/TeacherProfile"
        total:
          type: integer
      required: [teachers, total]

    UpdateTeacherSlugBody:
      type: object
      properties:
        slug:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[a-z0-9-]+$"
      required: [slug]

    TeacherRecording:
      type: object
      properties:
        id:
          type: integer
        teacherId:
          type: string
        url:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        instrument:
          type: ["string", "null"]
        isEnhanced:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, teacherId, url, title, sortOrder, createdAt, isEnhanced]

    TeacherRecordingListResponse:
      type: object
      properties:
        recordings:
          type: array
          items:
            $ref: "#/components/schemas/TeacherRecording"
      required: [recordings]

    CreateTeacherRecordingBody:
      type: object
      properties:
        url:
          type: string
        title:
          type: string
        description:
          type: string
        sortOrder:
          type: integer
      required: [url, title]

    UpdateTeacherProfileBody:
      type: object
      properties:
        bio:
          type: string
        instruments:
          type: array
          items:
            type: string
        genres:
          type: array
          items:
            type: string
        city:
          type: string
        country:
          type: string
        timezone:
          type: string
        hourlyRate:
          type: integer
        yearsExperience:
          type: integer
        education:
          type: string
        profileImageUrl:
          type: string
        websiteUrl:
          type: string
        videoIntroUrl:
          type: string
        cancellationPolicyHours:
          type: integer
          minimum: 1
          maximum: 336
        cancellationFeePercent:
          type: integer
          minimum: 0
          maximum: 100
        isPubliclyVisible:
          type: boolean
          description: Set to false to opt out of the public marketplace (only available within your school org).

    # ── Student Profile ──────────────────────────────────────────────────────
    StudentProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        bio:
          type: ["string", "null"]
        instruments:
          type: array
          items:
            type: string
        skillLevel:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        timezone:
          type: ["string", "null"]
        learningGoals:
          type: ["string", "null"]
        ageGroup:
          type: ["string", "null"]
        lessonsCompleted:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, userId, instruments, lessonsCompleted, createdAt]

    UpdateStudentProfileBody:
      type: object
      properties:
        bio:
          type: string
        instruments:
          type: array
          items:
            type: string
        skillLevel:
          type: string
        city:
          type: string
        country:
          type: string
        timezone:
          type: string
        learningGoals:
          type: string
        ageGroup:
          type: string

    # ── Listing ──────────────────────────────────────────────────────────────
    Listing:
      type: object
      properties:
        id:
          type: integer
        teacherId:
          type: string
        type:
          type: string
          enum: [lesson, event, masterclass, digital_product, coaching]
        status:
          type: string
          enum: [active, inactive, draft]
        title:
          type: string
        description:
          type: ["string", "null"]
        instrument:
          type: ["string", "null"]
        skillLevel:
          type: string
          enum: [beginner, intermediate, advanced, all]
        priceInCents:
          type: integer
        currency:
          type: string
        durationMinutes:
          type: ["integer", "null"]
        imageUrl:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        isOnline:
          type: boolean
        city:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        digitalProductId:
          type: ["integer", "null"]
          description: "ID of the associated digital product (only set when type=digital_product)"
        masterclassEventId:
          type: ["integer", "null"]
          description: "ID of the first upcoming masterclass event (only set when type=masterclass)"
        teacher:
          $ref: "#/components/schemas/TeacherProfile"
        createdAt:
          type: string
          format: date-time
      required: [id, teacherId, type, status, title, skillLevel, priceInCents, currency, tags, isOnline, createdAt]

    ListingListResponse:
      type: object
      properties:
        listings:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        total:
          type: integer
      required: [listings, total]

    CreateListingBody:
      type: object
      properties:
        type:
          type: string
          enum: [lesson, event, masterclass, digital_product, coaching]
        title:
          type: string
        description:
          type: string
        instrument:
          type: string
        skillLevel:
          type: string
          enum: [beginner, intermediate, advanced, all]
        priceInCents:
          type: integer
        durationMinutes:
          type: integer
        imageUrl:
          type: string
        tags:
          type: array
          items:
            type: string
        isOnline:
          type: boolean
        city:
          type: string
        country:
          type: string
      required: [type, title]

    UpdateListingBody:
      type: object
      properties:
        status:
          type: string
          enum: [active, inactive, draft]
        title:
          type: string
        description:
          type: string
        instrument:
          type: string
        skillLevel:
          type: string
        priceInCents:
          type: integer
        durationMinutes:
          type: integer
        imageUrl:
          type: string
        tags:
          type: array
          items:
            type: string

    # ── Masterclass ───────────────────────────────────────────────────────────
    Masterclass:
      type: object
      properties:
        id:
          type: integer
        listingId:
          type: integer
        teacherId:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        maxPerformers:
          type: integer
        maxObservers:
          type: integer
        performerPriceInCents:
          type: integer
        observerPriceInCents:
          type: integer
        currency:
          type: string
        registeredPerformers:
          type: integer
        registeredObservers:
          type: integer
        meetingUrl:
          type: ["string", "null"]
        recordingUrl:
          type: ["string", "null"]
        isLive:
          type: boolean
        isCancelled:
          type: boolean
        instrument:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        teacher:
          $ref: "#/components/schemas/TeacherProfile"
        createdAt:
          type: string
          format: date-time
      required: [id, listingId, teacherId, title, scheduledAt, durationMinutes, maxPerformers, maxObservers, performerPriceInCents, observerPriceInCents, currency, registeredPerformers, registeredObservers, isLive, isCancelled, createdAt]

    MasterclassListResponse:
      type: object
      properties:
        masterclasses:
          type: array
          items:
            $ref: "#/components/schemas/Masterclass"
        total:
          type: integer
      required: [masterclasses, total]

    CreateMasterclassBody:
      type: object
      properties:
        listingId:
          type: integer
        title:
          type: string
        description:
          type: string
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        maxPerformers:
          type: integer
        maxObservers:
          type: integer
        performerPriceInCents:
          type: integer
        observerPriceInCents:
          type: integer
        instrument:
          type: string
        imageUrl:
          type: string
      required: [listingId, title, scheduledAt, performerPriceInCents, observerPriceInCents]

    UpdateMasterclassBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        meetingUrl:
          type: string
        isCancelled:
          type: boolean

    # ── Live Concerts ──────────────────────────────────────────────────────────
    LiveConcert:
      type: object
      properties:
        id:
          type: integer
        teacherId:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        scheduledAt:
          type: string
          format: date-time
        streamUrl:
          type: string
        streamType:
          type: string
          enum: [youtube, mux]
        ticketPriceCents:
          type: integer
        maxTickets:
          type: integer
        soldTickets:
          type: integer
        replayAvailableUntil:
          type: ["string", "null"]
          format: date-time
        imageUrl:
          type: ["string", "null"]
        isCancelled:
          type: boolean
        teacher:
          $ref: "#/components/schemas/TeacherProfile"
        createdAt:
          type: string
          format: date-time
      required: [id, teacherId, title, scheduledAt, streamUrl, streamType, ticketPriceCents, maxTickets, soldTickets, isCancelled, createdAt]

    LiveConcertListResponse:
      type: object
      properties:
        concerts:
          type: array
          items:
            $ref: "#/components/schemas/LiveConcert"
        total:
          type: integer
      required: [concerts, total]

    CreateLiveConcertBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        scheduledAt:
          type: string
          format: date-time
        streamUrl:
          type: string
        streamType:
          type: string
          enum: [youtube, mux]
        ticketPriceCents:
          type: integer
        maxTickets:
          type: integer
        replayAvailableUntil:
          type: string
          format: date-time
        imageUrl:
          type: string
      required: [title, scheduledAt, streamUrl, ticketPriceCents]

    UpdateLiveConcertBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        scheduledAt:
          type: string
          format: date-time
        streamUrl:
          type: string
        streamType:
          type: string
          enum: [youtube, mux]
        ticketPriceCents:
          type: integer
        maxTickets:
          type: integer
        replayAvailableUntil:
          type: string
          format: date-time
        imageUrl:
          type: string
        isCancelled:
          type: boolean

    MyLiveConcertsResponse:
      type: object
      properties:
        concerts:
          type: array
          items:
            type: object
            properties:
              concert:
                $ref: "#/components/schemas/LiveConcert"
              soldTickets:
                type: integer
              grossRevenueCents:
                type: integer
              netRevenueCents:
                type: integer
            required: [concert, soldTickets, grossRevenueCents, netRevenueCents]
      required: [concerts]

    MyLiveConcertTicketResponse:
      type: object
      properties:
        hasTicket:
          type: boolean
        orderId:
          type: ["integer", "null"]
      required: [hasTicket]

    # ── Digital Product ───────────────────────────────────────────────────────
    DigitalProduct:
      type: object
      properties:
        id:
          type: integer
        listingId:
          type: integer
        teacherId:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: string
        instrument:
          type: ["string", "null"]
        difficulty:
          type: ["string", "null"]
        fileKey:
          type: ["string", "null"]
        fileSize:
          type: ["integer", "null"]
        fileType:
          type: ["string", "null"]
        previewUrl:
          type: ["string", "null"]
        downloadCount:
          type: integer
        isPublished:
          type: boolean
        priceInCents:
          type: integer
        currency:
          type: string
        teacher:
          $ref: "#/components/schemas/TeacherProfile"
        createdAt:
          type: string
          format: date-time
      required: [id, listingId, teacherId, title, category, downloadCount, isPublished, priceInCents, currency, createdAt]

    DigitalProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/DigitalProduct"
        total:
          type: integer
      required: [products, total]

    DigitalProductAnalyticsProduct:
      type: object
      properties:
        productId:
          type: integer
        title:
          type: string
        category:
          type: string
        downloadCount:
          type: integer
        salesCount:
          type: integer
        totalRevenueCents:
          type: integer
      required: [productId, title, category, downloadCount, salesCount, totalRevenueCents]

    DigitalProductAnalytics:
      type: object
      properties:
        totalRevenueCents:
          type: integer
        totalSalesCount:
          type: integer
        totalDownloadCount:
