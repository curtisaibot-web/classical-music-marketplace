components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    # ── User ────────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
          enum: [teacher, student, null]
        createdAt:
          type: string
          format: date-time
      required: [id, email, createdAt]

    OnboardUserBody:
      type: object
      properties:
        role:
          type: string
          enum: [teacher, student]
        firstName:
          type: string
        lastName:
          type: string
      required: [role]

    # ── Teacher Profile ──────────────────────────────────────────────────────
    TeacherProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        bio:
          type: ["string", "null"]
        instruments:
          type: array
          items:
            type: string
        genres:
          type: array
          items:
            type: string
        city:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        timezone:
          type: ["string", "null"]
        hourlyRate:
          type: ["integer", "null"]
        currency:
          type: string
        yearsExperience:
          type: ["integer", "null"]
        education:
          type: ["string", "null"]
        averageRating:
          type: integer
        reviewCount:
          type: integer
        isVerified:
          type: boolean
        profileImageUrl:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        videoIntroUrl:
          type: ["string", "null"]
        profileSlug:
          type: ["string", "null"]
        stripeOnboarded:
          type: boolean
        isProSubscriber:
          type: boolean
        cancellationPolicyHours:
          type: integer
        cancellationFeePercent:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time
      required: [id, userId, instruments, genres, currency, averageRating, reviewCount, isVerified, stripeOnboarded, createdAt]

    TeacherListResponse:
      type: object
      properties:
        teachers:
          type: array
          items:
            $ref: "#/components/schemas/TeacherProfile"
        total:
          type: integer
      required: [teachers, total]

    UpdateTeacherSlugBody:
      type: object
      properties:
        slug:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[a-z0-9-]+$"
      required: [slug]

    TeacherRecording:
      type: object
      properties:
        id:
          type: integer
        teacherId:
          type: string
        url:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, teacherId, url, title, sortOrder, createdAt]

    TeacherRecordingListResponse:
      type: object
      properties:
        recordings:
          type: array
          items:
            $ref: "#/components/schemas/TeacherRecording"
      required: [recordings]

    CreateTeacherRecordingBody:
      type: object
      properties:
        url:
          type: string
        title:
          type: string
        description:
          type: string
        sortOrder:
          type: integer
      required: [url, title]

    UpdateTeacherProfileBody:
      type: object
      properties:
        bio:
          type: string
        instruments:
          type: array
          items:
            type: string
        genres:
          type: array
          items:
            type: string
        city:
          type: string
        country:
          type: string
        timezone:
          type: string
        hourlyRate:
          type: integer
        yearsExperience:
          type: integer
        education:
          type: string
        profileImageUrl:
          type: string
        websiteUrl:
          type: string
        videoIntroUrl:
          type: string
        cancellationPolicyHours:
          type: integer
          minimum: 1
          maximum: 336
        cancellationFeePercent:
          type: integer
          minimum: 0
          maximum: 100

    # ── Student Profile ──────────────────────────────────────────────────────
    StudentProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        bio:
          type: ["string", "null"]
        instruments:
          type: array
          items:
            type: string
        skillLevel:
          type: ["string", "null"]
        city:
